{% extends "almacen/base.html" %}
{% block content %}
<div class="page-body">
  <div class="container-fluid">
    <div class="card">
      <div class="card-header"><h4>{{ titulo }}</h4></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6 mb-3"><label>Departamento</label>{{ form.departamento }}</div>
            <div class="col-md-6 mb-3"><label>Usuario</label>{{ form.usuario }}</div>
            <div class="col-md-3 mb-3"><label>Orden</label>{{ form.orden }}</div>
            <div class="col-md-3 mb-3 d-flex align-items-center"><div class="form-check mt-4">{{ form.activo }}<label class="form-check-label">Activo</label></div></div>
          </div>
          <div class="text-end">
            <a href="{% url 'asociaciones:revisores_constancia_list' %}" class="btn btn-light">Cancelar</a>
            <button type="submit" class="btn btn-primary">{{ accion }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
